<!doctype html><html><head><meta charset="utf-8"><title>Feral Bloom bestiary (dev gallery)</title>
<style>body{background:#18201a;color:#ddd;font:12px system-ui;margin:0;padding:8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}.c{background:#26332b;border-radius:8px;padding:4px;text-align:center}svg{width:100%;height:auto;display:block}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}@keyframes flick{to{transform:scale(.9,1.12) skewX(4deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.55}}
.drip{animation:drip 1.4s infinite}@keyframes drip{to{transform:translateY(10px);opacity:0}}</style></head><body><div class="g" id="g"></div>
<script type="module">
import { PET_SPECIES } from '../js/data/species.js';
import { ENEMIES as EN0, BOSSES } from '../js/data/enemies.js';
import { makePet, makeEnemy, makeHeart } from '../js/creature.js';
import { renderCreature } from '../js/svg.js';
import { MUTS } from '../js/data/mutations.js';
const ENEMIES = { ...EN0, ...BOSSES };
const q = new URLSearchParams(location.search); const mode = q.get('m') || 'all';
const g = document.getElementById('g'); const add = (c, label, opts) => { g.insertAdjacentHTML('beforeend', `<div class="c">${renderCreature(c, opts)}${label}</div>`); };
if (mode === 'all') {
  for (const s of Object.values(PET_SPECIES)) add(makePet(s), s.name, { side: 'p' });
  const pet = makePet(PET_SPECIES.mossling);
  for (const e of Object.values(ENEMIES)) { const c = e.mirror ? makeHeart(e, pet, 1) : makeEnemy(e, { scale: 1 }); add(c, e.name, { side: 'e', bars: 'all' }); }
}
if (mode === 'ids') {
  document.querySelector('.g').style.gridTemplateColumns = 'repeat(auto-fill,minmax(' + (q.get('w') || 460) + 'px,1fr))';
  const pet = makePet(PET_SPECIES.mossling);
  for (const id of q.get('i').split(',')) { if (PET_SPECIES[id]) add(makePet(PET_SPECIES[id]), id, { side: q.get('side') || 'p' }); else { const e = ENEMIES[id]; add(e.mirror ? makeHeart(e, pet, 1) : makeEnemy(e, { scale: 1 }), id, { side: q.get('side') || 'e', bars: 'all' }); } }
}
if (mode === 'mut') {
  const sp = q.get('s') || 'mossling'; const sl = (q.get('slot') || '');
  for (const m of Object.values(MUTS).slice(+(q.get('a')||0), +(q.get('b')||99))) { const pet = makePet(PET_SPECIES[sp]); const slot = m.slot === 'extra' ? 'ext1' : m.slot; if (!pet.parts[slot]) pet.parts[slot] = { slot, label: slot, hp: 8, max: 8, arm: 0, b: { hp: 8, arm: 0 }, sev: false, muts: [], trait: null }; pet.parts[slot].muts.push(m.id); add(pet, m.id + ' (' + m.slot + ')', { side: 'p' }); }
}
if (mode === 'sev') {
  const pet = makePet(PET_SPECIES.mossling); for (const sl of ['head', 'jaws', 'eyes', 'fore', 'hind', 'tail', 'back']) pet.parts[sl].sev = true; add(pet, 'sev', { side: 'p', sevNow: ['tail'] });
  const e = makeEnemy(ENEMIES.ash_hound, { scale: 1 }); e.parts.fore.sev = true; e.parts.eyes.sev = true; e.parts.torso.hp = 5; add(e, 'hound sev', { side: 'e', bars: 'all', hl: 'jaws', suggest: 'head' });
}
document.title = 'ready'; window.__ready = true;
</script></body></html>
